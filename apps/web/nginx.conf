server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router / SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: allow browser caching
    location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Never cache the SPA entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Basic health endpoint for deployment verification
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
